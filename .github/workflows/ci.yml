name: CI

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Security audit
        run: npm audit --audit-level=critical

      - name: 📝 Lint code
        run: npm run lint

      - name: ✅ Format check
        run: npm run format:check

      - name: 🧪 Run tests
        run: npm run test

      - name: 🏗️ Build project
        run: npm run build

      - name: 🔍 Verify SEO
        run: npm run verify:seo

      - name: 📊 Bundle size check
        run: |
          # Astro 7 + Workers adapter emits the Worker into dist/server (was dist/_worker.js).
          WORKER_KB=$(du -sk dist/server | cut -f1)
          WORKER_MB=$((WORKER_KB / 1024))
          echo "Worker bundle (dist/server): ${WORKER_MB}MB (${WORKER_KB}KB)"
          if [ "$WORKER_MB" -gt 10 ]; then
            echo "❌ Worker bundle too large (${WORKER_MB}MB > 10MB limit)"
            exit 1
          fi
          echo "✅ Worker bundle size is acceptable"

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: test
    # Only the production branch deploys; PRs and feature branches just run the test job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 🚀 Deploy to Cloudflare Workers
        # Uses the project's pinned wrangler; reads the adapter-generated
        # dist/server/wrangler.json via the root wrangler.toml.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
